name: Daily GEX log

on:
  schedule:
    # 13:00 UTC, Monday to Friday
    # = 5:00 AM Pacific in winter (PST), 6:00 AM Pacific in summer (PDT)
    - cron: "0 13 * * 1-5"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write # needed to push the new CSV row back to the repo

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and log SPY levels
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
        run: python flashalpha/fetch_levels.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flashalpha_spy.csv
          git commit -m "Log SPY levels for $(date -u +%Y-%m-%d)"
          git push
